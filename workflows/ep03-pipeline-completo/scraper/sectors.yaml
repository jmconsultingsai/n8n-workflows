# sectors.yaml — Industry sectors for the CVR lead scraper
#
# Each entry maps a sector key to:
#   name:  Human-readable label (shown in logs and CSV output)
#   codes: List of branchekoder (Danish industry classification codes, NACE-based)
#
# WHAT ARE BRANCHEKODER?
# -----------------------
# Branchekoder are Denmark's industry classification codes, derived from the EU's
# NACE Rev. 2 standard. Every registered Danish company is tagged with one or more
# of these codes in the CVR registry.
#
# You can look up codes at:
#   https://www.dst.dk/da/Statistik/dokumentation/nomenklaturer/DB07
#   https://datacvr.virk.dk/ (search a company to see its branchekode)
#
# ADAPTING TO YOUR COUNTRY
# -------------------------
# If you are scraping a different country's business registry:
#   1. Find the equivalent industry classification system (e.g., SIC codes in the US,
#      SBI codes in the Netherlands, NAF codes in France, CNAE in Spain/Argentina).
#   2. Replace the codes below with the relevant codes from that system.
#   3. Ask Claude (or any LLM) to help: "Give me the [country] industry codes
#      equivalent to branchekoder [list] for the [sector] sector."
#
# ADDING OR REMOVING SECTORS
# ---------------------------
# - Add a new block following the same format (key, name, codes list).
# - Remove a sector by deleting its block.
# - Run:  python scrape_cvr.py --sector <key>  to scrape a specific sector.
# - Run:  python scrape_cvr.py                 to scrape all sectors.

